services:
  frontend:
    build: ./frontend
    image: foodnet_frontend:latest
    restart: unless-stopped
    env_file: ./frontend/.env
    environment:
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    image: foodnet_backend:latest
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - NODE_OPTIONS=--dns-result-order=ipv4first
    ports:
      - "4000:4000"
    depends_on:
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    image: foodnet_worker:latest
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - OLLAMA_URL=http://ollama:11434
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      - redis
      - ollama

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  ollama-data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1300
